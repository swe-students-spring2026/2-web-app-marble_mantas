<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pantry Pals</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #fff;
            color: #000;
            display: flex;
            flex-direction: column;
        }

        .page {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 28px 16px 0;
        }

        .title {
            margin: 0;
            text-align: center;
            font-size: 1.9rem;
            font-weight: 400;
        }

        .logo-box {
            width: min(220px, 70vw);
            aspect-ratio: 191 / 176;
            background: #d9d9d9;
            margin: 56px auto 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .active-list {
            margin: 72px auto 0;
            font-size: 1.9rem;
            font-weight: 400;
            text-decoration: underline;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .bottom-nav {
            margin-top: auto;
            border: 1px solid #000;
            height: 96px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 34px;
            background: #fff;
        }

        .icon-button {
            border: none;
            background: transparent;
            padding: 6px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .icon-button:hover {
            background: #f2f2f2;
        }

        .icon-button:focus-visible {
            outline: 2px solid #000;
            outline-offset: 2px;
        }

        .icon-button img {
            width: 38px;
            height: 38px;
            object-fit: contain;
            display: block;
        }

        @media (max-width: 360px) {
            .title,
            .active-list {
                font-size: 1.6rem;
            }

            .logo-box {
                margin-top: 44px;
            }

            .active-list {
                margin-top: 56px;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <h1 class="title">Pantry Pals</h1>

        <div class="logo-box">Logo</div>

        <div class="active-list">active list name</div>

        <div class="bottom-nav">
            <button class="icon-button" type="button" aria-label="Home">
                <img src="images/home_icon.png" alt="Home icon" />
            </button>
            <button class="icon-button" type="button" aria-label="Add">
                <img src="images/plus_icon.png" alt="Plus icon" />
            </button>
            <button class="icon-button" type="button" aria-label="List">
                <img src="images/list_icon.png" alt="List icon" />
            </button>
            
        </div>
    </div>
</body>
</html>
