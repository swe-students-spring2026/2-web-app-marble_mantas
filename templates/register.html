<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #e5e5e5;
        }

        .register-card {
            width: 100%;
            max-width: 393px;
            min-height: 100dvh;
            padding: calc(env(safe-area-inset-top) + 36px) 22px env(safe-area-inset-bottom);
        }

        h1 {
            margin: 100px 0 0;
            font-size: 4.6rem;
            font-weight: 400;
            text-align: center;
        }

        form {
            margin-top: 64px;
        }

        .field {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        label {
            width: 160px;
            font-size: 1.8rem;
            font-weight: 400;
        }

        input[type="text"],
        input[type="password"] {
            flex: 1;
            min-width: 0;
            height: 44px;
            border: 1px solid #666;
            background: transparent;
            font-size: 1.3rem;
            padding: 0 10px;
        }

        button {
            display: block;
            margin: 12px 0 0 auto;
            min-width: 176px;
            height: 52px;
            border: 1px solid #000;
            background: #000;
            color: #fff;
            font-size: 1.6rem;
            font-weight: 400;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .error {
            margin-bottom: 12px;
            color: #b00020;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <main class="register-card">
        <h1>Sign In</h1>


        <form method="post" action="{{ url_for('auth_bp.register') }}">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required />
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="new-password" required />
            </div>

            <div class="field">
                <label for="confirm_password">Confirm</label>
                <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required />
            </div>

            <button type="submit">Create Account</button>
        </form>
    </main>
</body>
</html>
