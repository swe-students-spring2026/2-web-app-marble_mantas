<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Active List</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #e5e5e5;
            color: #111;
        }

        .page {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            padding: 20px 14px 0;
        }

        .header {
            margin-top: 52px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .back-link {
            color: #111;
            text-decoration: none;
            font-size: 38px;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 6px;
        }

        .back-link:hover {
            background: rgba(0, 0, 0, 0.07);
        }

        .title {
            margin: 0;
            font-size: 48px;
            font-weight: 400;
            line-height: 1;
        }

        .list-frame {
            margin: 26px auto 0;
            width: calc(100% - 34px);
            max-width: 326px;
            height: 540px;
            max-height: calc(100vh - 250px);
            border: 1px solid #777;
            background: transparent;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .category-group {
            border-bottom: 1px solid #777;
        }

        .category-toggle {
            list-style: none;
            height: 53px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: 400;
            text-align: center;
            cursor: pointer;
            background: #e5e5e5;
        }

        .category-toggle::-webkit-details-marker {
            display: none;
        }

        .category-toggle::marker {
            content: "";
        }

        details[open] > .category-toggle {
            background: #ededed;
        }

        .category-items {
            background: #e5e5e5;
        }

        .item-row {
            height: 39px;
            border-top: 1px solid #777;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 8px;
            font-size: 14px;
            color: #222;
        }

        .item-name {
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-qty {
            font-size: 12px;
            color: #444;
        }

        .item-check {
            width: 22px;
            height: 22px;
            border: 1px solid #555;
            background: transparent;
            color: #111;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            line-height: 1;
            padding: 0;
            cursor: pointer;
        }

        .item-check.checked {
            background: #f1f1f1;
        }

        .item-check:focus-visible {
            outline: 2px solid #111;
            outline-offset: 1px;
        }

        .empty-row {
            border-top: 1px solid #777;
            height: 39px;
            display: flex;
            align-items: center;
            padding: 0 8px;
            font-size: 14px;
            color: #666;
        }

        .bottom-nav {
            margin-top: auto;
            border: 1px solid #777;
            height: 108px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 30px;
            background: #efefef;
        }

        .icon-button {
            border: none;
            background: transparent;
            padding: 6px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .icon-button:hover {
            background: rgba(0, 0, 0, 0.06);
        }

        .icon-button img {
            width: 38px;
            height: 38px;
            object-fit: contain;
            display: block;
        }

        @media (max-width: 380px) {
            .title {
                font-size: 40px;
            }

            .category-toggle {
                font-size: 22px;
            }

            .item-row {
                font-size: 13px;
            }

            .item-qty {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="header">
            <a class="back-link" href="{{ url_for('auth_bp.home', demo=1) if demo_mode else url_for('auth_bp.home') }}" aria-label="Back">←</a>
            <h1 class="title">Active List Name</h1>
        </header>

        <section class="list-frame" aria-label="List categories">
            <details class="category-group" open>
                <summary class="category-toggle">Category 1</summary>
                <div class="category-items">
                    <div class="item-row">
                        <span class="item-name">Item 1</span>
                        <span class="item-qty">quantity</span>
                        <button class="item-check" type="button" aria-label="Toggle Item 1 complete" aria-pressed="false"></button>
                    </div>
                    <div class="item-row">
                        <span class="item-name">Item 2</span>
                        <span class="item-qty">quantity</span>
                        <button class="item-check" type="button" aria-label="Toggle Item 2 complete" aria-pressed="false"></button>
                    </div>
                    <div class="item-row">
                        <span class="item-name">Item 3</span>
                        <span class="item-qty">quantity</span>
                        <button class="item-check" type="button" aria-label="Toggle Item 3 complete" aria-pressed="false"></button>
                    </div>
                    <div class="item-row">
                        <span class="item-name">Item 4</span>
                        <span class="item-qty">quantity</span>
                        <button class="item-check" type="button" aria-label="Toggle Item 4 complete" aria-pressed="false"></button>
                    </div>
                </div>
            </details>

            <details class="category-group">
                <summary class="category-toggle">Category 2</summary>
                <div class="category-items">
                    <div class="empty-row">No items yet</div>
                </div>
            </details>

            <details class="category-group">
                <summary class="category-toggle">Category 3</summary>
                <div class="category-items">
                    <div class="empty-row">No items yet</div>
                </div>
            </details>
        </section>

        <nav class="bottom-nav" aria-label="Bottom navigation">
            <button class="icon-button" type="button" aria-label="Home">
                <img src="/images/home_icon.png" alt="Home icon" />
            </button>
            <a class="icon-button" href="{{ url_for('items_bp.create_item_form', demo=1) if demo_mode else url_for('items_bp.create_item_form') }}" aria-label="Add">
                <img src="/images/plus_icon.png" alt="Plus icon" />
            </a>
            <button class="icon-button" type="button" aria-label="List">
                <img src="/images/list_icon.png" alt="List icon" />
            </button>
        </nav>
    </main>
    <script>
        const checkButtons = document.querySelectorAll(".item-check");
        checkButtons.forEach((button) => {
            button.addEventListener("click", () => {
                const nextChecked = !button.classList.contains("checked");
                button.classList.toggle("checked", nextChecked);
                button.setAttribute("aria-pressed", String(nextChecked));
                button.textContent = nextChecked ? "x" : "";
            });
        });
    </script>
</body>
</html>
