<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Active List</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100dvh;
            font-family: Arial, sans-serif;
            background: #e5e5e5;
            color: #111;
        }

        .page {
            width: 100%;
            max-width: 393px;
            min-height: 100dvh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            padding: calc(env(safe-area-inset-top) + 20px) 16px env(safe-area-inset-bottom);
        }

        .header {
            margin-top: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-link {
            color: #111;
            text-decoration: none;
            font-size: 2.9rem;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 6px;
        }

        .back-link:hover {
            background: rgba(0, 0, 0, 0.07);
        }

        .title {
            margin: 0;
            font-size: 3rem;
            font-weight: 400;
            line-height: 1;
        }

        .list-frame {
            margin: 26px auto 0;
            width: calc(100% - 34px);
            max-width: 326px;
            height: 530px;
            max-height: calc(100dvh - 255px);
            border: 1px solid #777;
            background: transparent;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .category-group {
            border-bottom: 1px solid #777;
        }

        .category-toggle {
            list-style: none;
            height: 53px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 400;
            text-align: center;
            cursor: pointer;
            background: #e5e5e5;
        }

        .category-toggle::-webkit-details-marker {
            display: none;
        }

        .category-toggle::marker {
            content: "";
        }

        details[open] > .category-toggle {
            background: #ededed;
        }

        .category-items {
            background: #e5e5e5;
        }

        .item-row {
            height: 39px;
            border-top: 1px solid #777;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 8px;
            font-size: 1rem;
            color: #222;
        }

        .item-name {
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-qty {
            font-size: 0.86rem;
            color: #444;
        }

        .item-check {
            width: 22px;
            height: 22px;
            border: 1px solid #555;
            background: transparent;
            color: #111;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            line-height: 1;
            padding: 0;
            cursor: pointer;
        }

        .item-check.checked {
            background: #f1f1f1;
        }

        .item-check:focus-visible {
            outline: 2px solid #111;
            outline-offset: 1px;
        }

        .empty-row {
            border-top: 1px solid #777;
            height: 39px;
            display: flex;
            align-items: center;
            padding: 0 8px;
            font-size: 0.95rem;
            color: #666;
        }

        .bottom-nav {
            margin-top: auto;
            border: 1px solid #777;
            height: 104px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 22px;
            background: #efefef;
        }

        .icon-button {
            border: none;
            background: transparent;
            padding: 6px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .icon-button:hover {
            background: rgba(0, 0, 0, 0.06);
        }

        .icon-button img {
            width: 46px;
            height: 46px;
            object-fit: contain;
            display: block;
        }

        @media (max-width: 380px) {
            .title {
                font-size: 2.3rem;
            }

            .category-toggle {
                font-size: 1.55rem;
            }

            .item-row {
                font-size: 0.95rem;
            }

            .item-qty {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="header">
            <a class="back-link" href="{{ url_for('auth_bp.home', demo=1) if demo_mode else url_for('auth_bp.home') }}" aria-label="Back">←</a>
            <h1 class="title" id="activeListTitle">Active List Name</h1>
        </header>

        <section class="list-frame" id="activeListFrame" aria-label="List categories"></section>

        <nav class="bottom-nav" aria-label="Bottom navigation">
            <a class="icon-button" href="{{ url_for('auth_bp.home', demo=1) if demo_mode else url_for('auth_bp.home') }}" aria-label="Home">
                <img src="/images/home_icon.png" alt="Home icon" />
            </a>
            <a class="icon-button" href="{{ url_for('items_bp.create_item_form', demo=1) if demo_mode else url_for('items_bp.create_item_form') }}" aria-label="Add">
                <img src="/images/plus_icon.png" alt="Plus icon" />
            </a>
            <a class="icon-button" href="{{ url_for('auth_bp.profile', demo=1) if demo_mode else url_for('auth_bp.profile') }}" aria-label="Profile">
                <img src="/images/list_icon.png" alt="Profile icon" />
            </a>
        </nav>
    </main>
    <script>
        const LISTS_KEY = "pantrypal_lists_v1";
        const ACTIVE_KEY = "pantrypal_active_list_id_v1";
        const params = new URLSearchParams(window.location.search);
        const demoMode = {{ "true" if demo_mode else "false" }};
        const explicitListId = params.get("list");

        const titleEl = document.getElementById("activeListTitle");
        const frameEl = document.getElementById("activeListFrame");

        function makeDefaultLists() {
            const baseItems = [
                { id: "seed-item-1", name: "Item 1", quantity: "quantity" },
                { id: "seed-item-2", name: "Item 2", quantity: "quantity" },
                { id: "seed-item-3", name: "Item 3", quantity: "quantity" },
                { id: "seed-item-4", name: "Item 4", quantity: "quantity" },
            ];

            return [1, 2, 3, 4, 5].map((index) => ({
                id: `seed-list-${index}`,
                name: `List ${index}`,
                categories: [
                    {
                        id: `seed-list-${index}-cat-1`,
                        name: "Category 1",
                        items: index === 1 ? baseItems.map((item) => ({ ...item })) : [],
                    },
                    {
                        id: `seed-list-${index}-cat-2`,
                        name: "Category 2",
                        items: [],
                    },
                    {
                        id: `seed-list-${index}-cat-3`,
                        name: "Category 3",
                        items: [],
                    },
                ],
            }));
        }

        function readLists() {
            try {
                const parsed = JSON.parse(localStorage.getItem(LISTS_KEY) || "[]");
                return Array.isArray(parsed) ? parsed : [];
            } catch (error) {
                return [];
            }
        }

        function writeLists(lists) {
            localStorage.setItem(LISTS_KEY, JSON.stringify(lists));
        }

        function ensureLists() {
            let lists = readLists();
            if (lists.length === 0) {
                lists = makeDefaultLists();
                writeLists(lists);
            }
            return lists;
        }

        function renderList(listData) {
            frameEl.innerHTML = "";
            const categories = Array.isArray(listData.categories) ? listData.categories : [];

            if (categories.length === 0) {
                const placeholder = document.createElement("div");
                placeholder.className = "empty-row";
                frameEl.appendChild(placeholder);
                return;
            }

            categories.forEach((category, categoryIndex) => {
                const details = document.createElement("details");
                details.className = "category-group";
                if (categoryIndex === 0) {
                    details.open = true;
                }

                const summary = document.createElement("summary");
                summary.className = "category-toggle";
                summary.textContent = category.name;
                details.appendChild(summary);

                const itemsWrap = document.createElement("div");
                itemsWrap.className = "category-items";

                const items = Array.isArray(category.items) ? category.items : [];
                if (items.length === 0) {
                    const empty = document.createElement("div");
                    empty.className = "empty-row";
                    empty.textContent = "No items yet";
                    itemsWrap.appendChild(empty);
                } else {
                    items.forEach((item) => {
                        const row = document.createElement("div");
                        row.className = "item-row";

                        const name = document.createElement("span");
                        name.className = "item-name";
                        name.textContent = item.name || "Item";

                        const qty = document.createElement("span");
                        qty.className = "item-qty";
                        qty.textContent = item.quantity || "quantity";

                        const check = document.createElement("button");
                        check.className = "item-check";
                        check.type = "button";
                        check.setAttribute("aria-label", `Toggle ${item.name || "item"} complete`);
                        check.setAttribute("aria-pressed", "false");
                        check.addEventListener("click", () => {
                            const nextChecked = !check.classList.contains("checked");
                            check.classList.toggle("checked", nextChecked);
                            check.setAttribute("aria-pressed", String(nextChecked));
                            check.textContent = nextChecked ? "x" : "";
                        });

                        row.appendChild(name);
                        row.appendChild(qty);
                        row.appendChild(check);
                        itemsWrap.appendChild(row);
                    });
                }

                details.appendChild(itemsWrap);
                frameEl.appendChild(details);
            });
        }

        const lists = ensureLists();
        let activeId = localStorage.getItem(ACTIVE_KEY);
        if (!activeId || !lists.some((list) => list.id === activeId)) {
            activeId = lists[0]?.id || null;
            if (activeId) {
                localStorage.setItem(ACTIVE_KEY, activeId);
            }
        }

        let selectedList = lists.find((list) => list.id === explicitListId);
        if (!selectedList) {
            selectedList = lists.find((list) => list.id === activeId) || lists[0];
        }

        if (!selectedList) {
            selectedList = {
                name: "Active List Name",
                categories: [],
            };
        }

        titleEl.textContent = selectedList.name || "Active List Name";
        renderList(selectedList);
    </script>
</body>
</html>
