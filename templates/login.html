<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/shared.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <main class="login-card">
        <h1>Login</h1>

        {% if error %}
        <p class="error-msg" style="text-align: center;">{{ error }}</p>
        {% endif %}

        <form method="post" action="{{ url_for('auth_bp.login') }}">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required />
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required />
            </div>

            <button type="submit" class="btn-primary login-btn">Login</button>
        </form>

        <p class="signup"><a href="{{ url_for('auth_bp.register') }}">Sign Up</a></p>
    </main>
</body>
</html>
