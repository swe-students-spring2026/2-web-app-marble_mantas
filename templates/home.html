<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pantry Pals</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/shared.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
</head>
<body>
    {% set requested_active = request.args.get('active') %}
    {% set display_active = requested_active or active_list_name %}

    <div class="page">
        <div class="logo-box">
            <img
                src="{{ url_for('static', filename='images/pantry_pals_logo.svg') }}"
                alt="Pantry Pals logo"
            />
        </div>

        <div class="active-list-container">
            {% if display_active %}
                <div class="active-list-label">Active List:</div>
                <a
                    class="active-list"
                    id="activeListLink"
                    href="{{ url_for('items_bp.active_list_page', list=display_active, active=display_active) }}"
                >{{ display_active }}</a>
            {% else %}
                <span class="active-list inactive">no active list</span>
            {% endif %}
        </div>

        <div class="bottom-nav">
            <a
                class="icon-button"
                href="{{ url_for('auth_bp.home', active=display_active) if display_active else url_for('auth_bp.home') }}"
                aria-label="Home"
            >
                <img src="{{ url_for('static', filename='images/home_icon.png') }}" alt="Home icon" />
            </a>
            <a
                class="icon-button"
                href="{{ url_for('items_bp.create_item_form', active=display_active) if display_active else url_for('items_bp.create_item_form') }}"
                aria-label="Add"
            >
                <img src="{{ url_for('static', filename='images/plus_icon.png') }}" alt="Plus icon" />
            </a>
            <a
                class="icon-button"
                href="{{ url_for('auth_bp.profile', active=display_active) if display_active else url_for('auth_bp.profile') }}"
                aria-label="Profile"
            >
                <img src="{{ url_for('static', filename='images/list_icon.png') }}" alt="Profile icon" />
            </a>
        </div>
    </div>
</body>
</html>
