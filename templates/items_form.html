<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/items_form.css') }}">
</head>
<body>
    <main class="page">
        <section class="view" id="editorView">
            <div class="editor-form">
                <div class="field-row">
                    <label for="listNameInput">List Name:</label>
                    <input id="listNameInput" type="text" />
                </div>

                <div class="field-row category-add-row">
                    <label for="categoryInput">Categories:</label>
                    <input id="categoryInput" type="text" />
                    <button class="category-add-btn" id="addCategoryBtn" type="button" aria-label="Add category">+</button>
                </div>

                <div class="category-wrap" id="categoryWrap" aria-live="polite"></div>

                <div class="section-title">Add Item:</div>

                <div class="field-row">
                    <label for="itemNameInput">Name:</label>
                    <input id="itemNameInput" type="text" />
                </div>

                <div class="field-row">
                    <label for="itemQtyInput">Quantity:</label>
                    <input id="itemQtyInput" type="text" />
                </div>

                <div class="add-item-row">
                    <button class="solid-btn" id="addItemBtn" type="button">Add</button>
                </div>

                <p class="status-message" id="statusMessage"></p>

                <button class="preview-link" id="openPreviewBtn" type="button">preview_list</button>

                <div class="create-row">
                    <button class="solid-btn" id="createListBtn" type="button">Create</button>
                </div>
            </div>

            <nav class="bottom-nav" aria-label="Bottom navigation">
                <a class="icon-button" href="{{ url_for('auth_bp.home', demo=1) if demo_mode else url_for('auth_bp.home') }}" aria-label="Home">
                    <img src="{{ url_for('static', filename='images/home_icon.png') }}" alt="Home icon" />
                </a>
                <a class="icon-button" href="{{ url_for('items_bp.create_item_form', demo=1) if demo_mode else url_for('items_bp.create_item_form') }}" aria-label="Add">
                    <img src="{{ url_for('static', filename='images/plus_icon.png') }}" alt="Plus icon" />
                </a>
                <a class="icon-button" href="{{ url_for('auth_bp.profile', demo=1) if demo_mode else url_for('auth_bp.profile') }}" aria-label="Profile">
                    <img src="{{ url_for('static', filename='images/list_icon.png') }}" alt="Profile icon" />
                </a>
            </nav>
        </section>

        <section class="view hidden" id="previewView">
            <header class="preview-header">
                <button class="back-link" id="closePreviewBtn" type="button" aria-label="Back">&#8592;</button>
                <h1 class="preview-title" id="previewTitle">Preview List Name</h1>
            </header>

            <section class="preview-frame" id="previewFrame" aria-label="Preview list"></section>

            <nav class="bottom-nav" aria-label="Bottom navigation">
                <a class="icon-button" href="{{ url_for('auth_bp.home', demo=1) if demo_mode else url_for('auth_bp.home') }}" aria-label="Home">
                    <img src="{{ url_for('static', filename='images/home_icon.png') }}" alt="Home icon" />
                </a>
                <a class="icon-button" href="{{ url_for('items_bp.create_item_form', demo=1) if demo_mode else url_for('items_bp.create_item_form') }}" aria-label="Add">
                    <img src="{{ url_for('static', filename='images/plus_icon.png') }}" alt="Plus icon" />
                </a>
                <a class="icon-button" href="{{ url_for('auth_bp.profile', demo=1) if demo_mode else url_for('auth_bp.profile') }}" aria-label="Profile">
                    <img src="{{ url_for('static', filename='images/list_icon.png') }}" alt="Profile icon" />
                </a>
            </nav>
        </section>
    </main>

    <script>
        const state = {
            categories: [],
            selectedCategoryId: null,
            nextCategoryId: 1,
        };
        const params = new URLSearchParams(window.location.search);
        const demoMode = params.get("demo") === "1";
        const previewMode = params.get("view") === "preview";
        const LISTS_KEY = "pantrypal_lists_v1";
        const ACTIVE_KEY = "pantrypal_active_list_id_v1";

        const categoryWrap = document.getElementById("categoryWrap");
        const statusMessage = document.getElementById("statusMessage");
        const categoryInput = document.getElementById("categoryInput");
        const listNameInput = document.getElementById("listNameInput");
        const itemNameInput = document.getElementById("itemNameInput");
        const itemQtyInput = document.getElementById("itemQtyInput");
        const previewTitle = document.getElementById("previewTitle");
        const previewFrame = document.getElementById("previewFrame");
        const editorView = document.getElementById("editorView");
        const previewView = document.getElementById("previewView");

        function setMessage(message) {
            statusMessage.textContent = message;
        }

        function readStoredLists() {
            try {
                const parsed = JSON.parse(localStorage.getItem(LISTS_KEY) || "[]");
                return Array.isArray(parsed) ? parsed : [];
            } catch (error) {
                return [];
            }
        }

        function writeStoredLists(lists) {
            localStorage.setItem(LISTS_KEY, JSON.stringify(lists));
        }

        function createListPayload() {
            const listId = `list-${Date.now()}`;
            return {
                id: listId,
                name: listNameInput.value.trim() || "List Name",
                categories: state.categories.map((category, categoryIndex) => ({
                    id: `cat-${listId}-${categoryIndex}`,
                    name: category.name,
                    items: (Array.isArray(category.items) ? category.items : []).map((item, itemIndex) => ({
                        id: `item-${listId}-${categoryIndex}-${itemIndex}`,
                        name: item.name,
                        quantity: item.quantity,
                    })),
                })),
            };
        }

        function createList() {
            if (state.categories.length === 0) {
                setMessage("Add at least one category before creating.");
                return;
            }

            const newList = createListPayload();
            const lists = readStoredLists();
            lists.push(newList);
            writeStoredLists(lists);

            if (!localStorage.getItem(ACTIVE_KEY)) {
                localStorage.setItem(ACTIVE_KEY, newList.id);
            }

            const profileUrl = new URL("{{ url_for('auth_bp.profile') }}", window.location.origin);
            if (demoMode) {
                profileUrl.searchParams.set("demo", "1");
            }
            profileUrl.searchParams.set("list", newList.id);
            window.location.href = `${profileUrl.pathname}${profileUrl.search}`;
        }

        function renderCategoryChips() {
            categoryWrap.innerHTML = "";
            state.categories.forEach((category) => {
                const chip = document.createElement("div");
                chip.className = "category-chip";
                if (state.selectedCategoryId === category.id) {
                    chip.classList.add("selected");
                }

                chip.setAttribute("role", "button");
                chip.setAttribute("tabindex", "0");
                chip.setAttribute("aria-pressed", String(state.selectedCategoryId === category.id));

                chip.addEventListener("click", () => {
                    if (state.selectedCategoryId === category.id) {
                        state.selectedCategoryId = null;
                    } else {
                        state.selectedCategoryId = category.id;
                    }
                    renderCategoryChips();
                });

                chip.addEventListener("keydown", (event) => {
                    if (event.key === "Enter" || event.key === " ") {
                        event.preventDefault();
                        chip.click();
                    }
                });

                const text = document.createElement("span");
                text.textContent = category.name;

                const removeButton = document.createElement("button");
                removeButton.className = "chip-remove";
                removeButton.type = "button";
                removeButton.textContent = "x";
                removeButton.setAttribute("aria-label", `Delete ${category.name}`);
                removeButton.addEventListener("click", (event) => {
                    event.stopPropagation();
                    state.categories = state.categories.filter((item) => item.id !== category.id);
                    if (state.selectedCategoryId === category.id) {
                        state.selectedCategoryId = null;
                    }
                    renderCategoryChips();
                    renderPreview();
                });

                chip.appendChild(text);
                chip.appendChild(removeButton);
                categoryWrap.appendChild(chip);
            });
        }

        function getPreviewCategories() {
            if (state.categories.length > 0) {
                return state.categories;
            }
            return [
                { id: 1, name: "Category 1", items: [] },
                { id: 2, name: "Category 2", items: [] },
                { id: 3, name: "Category 3", items: [] },
            ];
        }

        function renderPreview() {
            const listName = listNameInput.value.trim();
            previewTitle.textContent = listName || "Preview List Name";
            previewFrame.innerHTML = "";

            const previewCategories = getPreviewCategories();
            previewCategories.forEach((category, index) => {
                const details = document.createElement("details");
                details.className = "preview-category";
                if (index === 0) {
                    details.open = true;
                }

                const summary = document.createElement("summary");
                summary.className = "preview-category-toggle";
                summary.textContent = category.name;

                const itemsContainer = document.createElement("div");
                itemsContainer.className = "preview-category-items";

                if (category.items.length === 0) {
                    const empty = document.createElement("div");
                    empty.className = "preview-empty-row";
                    itemsContainer.appendChild(empty);
                } else {
                    category.items.forEach((item) => {
                        const row = document.createElement("div");
                        row.className = "preview-item-row";

                        const name = document.createElement("span");
                        name.textContent = item.name;

                        const qty = document.createElement("span");
                        qty.className = "preview-item-qty";
                        qty.textContent = item.quantity;

                        row.appendChild(name);
                        row.appendChild(qty);
                        itemsContainer.appendChild(row);
                    });
                }

                details.appendChild(summary);
                details.appendChild(itemsContainer);
                previewFrame.appendChild(details);
            });
        }

        function addCategory() {
            const categoryName = categoryInput.value.trim();
            if (!categoryName) {
                setMessage("Enter a category first.");
                return;
            }

            state.categories.push({
                id: state.nextCategoryId,
                name: categoryName,
                items: [],
            });
            state.nextCategoryId += 1;
            categoryInput.value = "";
            setMessage("");
            renderCategoryChips();
            renderPreview();
        }

        function addItem() {
            if (state.selectedCategoryId === null) {
                setMessage("Select a category before adding an item.");
                return;
            }

            const itemName = itemNameInput.value.trim();
            const itemQuantity = itemQtyInput.value.trim();
            if (!itemName || !itemQuantity) {
                setMessage("Enter both item name and quantity.");
                return;
            }

            const selectedCategory = state.categories.find((category) => category.id === state.selectedCategoryId);
            if (!selectedCategory) {
                setMessage("Selected category was not found.");
                return;
            }

            selectedCategory.items.push({
                name: itemName,
                quantity: itemQuantity,
            });

            itemNameInput.value = "";
            itemQtyInput.value = "";
            setMessage("");
            renderPreview();
        }

        function openPreview() {
            renderPreview();
            editorView.classList.add("hidden");
            previewView.classList.remove("hidden");
        }

        function closePreview() {
            previewView.classList.add("hidden");
            editorView.classList.remove("hidden");
        }

        function loadDemoData() {
            listNameInput.value = "Preview List Name";
            state.categories = [
                {
                    id: 1,
                    name: "Category 1",
                    items: [
                        { name: "Item 1", quantity: "quantity" },
                        { name: "Item 2", quantity: "quantity" },
                        { name: "Item 3", quantity: "quantity" },
                        { name: "Item 4", quantity: "quantity" },
                    ],
                },
                {
                    id: 2,
                    name: "Category 2",
                    items: [],
                },
                {
                    id: 3,
                    name: "Category 3",
                    items: [],
                },
            ];
            state.selectedCategoryId = null;
            state.nextCategoryId = 4;
        }

        document.getElementById("addCategoryBtn").addEventListener("click", addCategory);
        document.getElementById("addItemBtn").addEventListener("click", addItem);
        document.getElementById("openPreviewBtn").addEventListener("click", openPreview);
        document.getElementById("closePreviewBtn").addEventListener("click", closePreview);
        document.getElementById("createListBtn").addEventListener("click", createList);

        categoryInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                event.preventDefault();
                addCategory();
            }
        });

        if (demoMode) {
            loadDemoData();
        }

        renderCategoryChips();
        renderPreview();

        if (previewMode) {
            openPreview();
        }
    </script>
</body>
</html>
