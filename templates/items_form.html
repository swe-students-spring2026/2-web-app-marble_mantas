<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% if item and item.get('id') %}Edit Item{% else %}Add Item{% endif %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/shared.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/items_form.css') }}">
</head>
<body>
    {% set active_name = request.args.get('active') %}

    <main class="page">
        <section class="view" id="editorView">
            <form class="editor-form" action="{{ url_for('items_bp.update_item', item_id=item.id) if item and item.get('id') else url_for('items_bp.create_item') }}" method="POST">
                {% if error %}
                    <p class="status-message">{{ error }}</p>
                {% endif %}

                <div class="field-row">
                    <label for="listNameInput">List Name:</label>
                    <input id="listNameInput" name="list" type="text" value="{{ item.get('list', '') if item else request.args.get('list', 'My List') }}" list="existingLists" required />
                    <datalist id="existingLists">
                        {% for l in existing_lists %}
                            <option value="{{ l }}"></option>
                        {% endfor %}
                    </datalist>
                </div>

                <div class="field-row">
                    <label for="categoryInput">Category:</label>
                    <input id="categoryInput" name="category" type="text" value="{{ item.get('category', '') if item else 'Uncategorized' }}" list="existingCategories" />
                    <datalist id="existingCategories">
                        {% for c in existing_categories %}
                            <option value="{{ c }}"></option>
                        {% endfor %}
                    </datalist>
                </div>

                <div class="field-row">
                    <label for="itemNameInput">Name:</label>
                    <input id="itemNameInput" name="name" type="text" value="{{ item.get('name', '') if item else '' }}" required />
                </div>

                <div class="field-row">
                    <label for="itemQtyInput">Quantity:</label>
                    <input id="itemQtyInput" name="quantity" type="number" min="1" value="{{ item.get('quantity', 1) if item else 1 }}" required />
                </div>

                <div class="field-row">
                    <label for="itemStatusInput">Status:</label>
                    <select id="itemStatusInput" name="status" class="form-select">
                        <option value="to_buy" {% if item and item.get('status') == 'to_buy' %}selected{% endif %}>To Buy</option>
                        <option value="pantry" {% if item and item.get('status') == 'pantry' %}selected{% endif %}>Completed</option>
                    </select>
                </div>
                
                <input type="hidden" name="origin" value="{{ request.args.get('origin', '') }}">

                <div class="create-row-flex">
                    <button class="btn-primary btn-form-action form-flex-child" id="createListBtn" type="submit">
                        {% if item and item.get('id') %}Update{% else %}Create{% endif %}
                    </button>
                    {% if item and item.get('id') %}
                        <a href="{{ request.referrer or url_for('items_bp.pantry_list') }}" class="btn-primary btn-form-action btn-cancel form-flex-child">Cancel</a>
                    {% endif %}
                </div>
            </form>
            
            {% if item and item.get('id') %}
            <form action="{{ url_for('items_bp.delete_item', item_id=item.id) }}" method="POST" style="padding: 0 2px; margin-bottom: 20px;">
                <button type="submit" class="btn-primary btn-form-action btn-danger" style="width: 100%;" onsubmit="return confirm('Delete this item?');">Delete Item</button>
            </form>
            {% endif %}

            <nav class="bottom-nav" aria-label="Bottom navigation">
                <a
                    class="icon-button"
                    href="{{ url_for('auth_bp.home', active=active_name) if active_name else url_for('auth_bp.home') }}"
                    aria-label="Home"
                >
                    <img src="{{ url_for('static', filename='images/home_icon.png') }}" alt="Home icon" />
                </a>
                <a
                    class="icon-button"
                    href="{{ url_for('items_bp.create_item_form', active=active_name) if active_name else url_for('items_bp.create_item_form') }}"
                    aria-label="Add"
                >
                    <img src="{{ url_for('static', filename='images/plus_icon.png') }}" alt="Plus icon" />
                </a>
                <a
                    class="icon-button"
                    href="{{ url_for('auth_bp.profile', active=active_name) if active_name else url_for('auth_bp.profile') }}"
                    aria-label="Profile"
                >
                    <img src="{{ url_for('static', filename='images/list_icon.png') }}" alt="Profile icon" />
                </a>
            </nav>
        </section>
    </main>
</body>
</html>
